# yaml-language-server: $schema=./system.schema.json
# Restaurant/dining APIs coordinate visits and deletion over bounded HTTP.
# Student-authored schema from Assignment 2 §8a, not professor-provided.
# Confirmed naming; Azure resources below are planned, not provisioned.
student: afijo2024
prefix: afijo2024
public_url: http://localhost:8080
ui:
  path: ui
  static_web_app: afijo2024-ui
  calls: [restaurants, dining]
azure:
  resource_group: rg-sdd-3a
  container_apps_environment: afijo2024-env
  sql_server: afijo2024-sql
  registry: ghcr.io/afg64
services:
  restaurants:
    description: Restaurant catalog, saved entries, personal details and locations.
    path: services/restaurants
    openapi: services/restaurants/openapi.yaml
    port_default: 8000
    health: /health
    migrations: services/restaurants/migrations
    env:
      PORT: {default: 8000, description: HTTP listening port}
      DATABASE_URL: {secret: true, description: Own restaurant SQL database connection string}
      VERSION: {default: local, description: Git SHA injected by the image build/deployment}
      UI_ORIGIN: {default: 'http://localhost:8080', description: Single allowed browser origin}
      DINING_URL: {default: 'http://dining:8000', description: Dining API base URL in compose}
      DINING_TIMEOUT_S: {default: 2, description: Timeout in seconds for each dining HTTP call}
      GEOCODER_BASE_URL: {default: 'https://nominatim.openstreetmap.org', description: Address lookup provider base URL}
      GEOCODER_TIMEOUT_S: {default: 5, description: Bounded address lookup timeout in seconds}
    calls:
      - service: dining
        url_env: DINING_URL
        endpoints: ['DELETE /saved-restaurants/{saved_id}/history']
        timeout_s: 2
        on_failure: Saved entry is revoked first. Return 503 cleanup_pending if dining cleanup is unconfirmed; retry the same idempotent DELETE until 204. Catalog retained.
    azure:
      container_app: afijo2024-restaurants
      sql_database: afijo2024-restaurants-db
  dining:
    description: Visits, ordered items and durable bill contents; saved IDs are external references.
    path: services/dining
    openapi: services/dining/openapi.yaml
    port_default: 8000
    health: /health
    migrations: services/dining/migrations
    env:
      PORT: {default: 8000, description: HTTP listening port}
      DATABASE_URL: {secret: true, description: Own dining SQL database connection string}
      VERSION: {default: local, description: Git SHA injected by the image build/deployment}
      UI_ORIGIN: {default: 'http://localhost:8080', description: Single allowed browser origin}
      RESTAURANTS_URL: {default: 'http://restaurants:8000', description: Restaurant API base URL in compose}
      RESTAURANTS_TIMEOUT_S: {default: 2, description: Timeout in seconds for each restaurant HTTP call}
    calls:
      - service: restaurants
        url_env: RESTAURANTS_URL
        endpoints: ['GET /saved-restaurants/{saved_id}', 'PUT /saved-restaurants/{saved_id}/visited']
        timeout_s: 2
        on_failure: Return 503 peer_unavailable with no visit write, or visit_outcome_uncertain if own commit cannot be confirmed. Status may already be visited. Never blindly retry POST; check history. Own history and health do not call the peer.
    azure:
      container_app: afijo2024-dining
      sql_database: afijo2024-dining-db

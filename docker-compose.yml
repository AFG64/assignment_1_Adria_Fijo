name: picky
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
    depends_on:
      db-init: {condition: service_started}
    entrypoint: [python3, /local/bootstrap.py, server]
    volumes:
      - sql-data:/var/opt/mssql
      - sql-password:/run/picky/sql:ro
      - ./db/local_bootstrap.py:/local/bootstrap.py:ro
    healthcheck:
      test: [CMD, python3, /local/bootstrap.py, health]
      interval: 5s
      timeout: 8s
      retries: 30
      start_period: 30s
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    user: '0'
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
      RESTAURANTS_PASSWORD: ${RESTAURANTS_PASSWORD:-}
      DINING_PASSWORD: ${DINING_PASSWORD:-}
    volumes:
      - ./db/init.sql:/init.sql:ro
      - ./db/local_bootstrap.py:/local/bootstrap.py:ro
      - sql-password:/run/picky/sql
      - restaurants-password:/run/picky/restaurants
      - dining-password:/run/picky/dining
      - sql-data:/var/opt/mssql:ro
    entrypoint: [python3, /local/bootstrap.py, init]
  restaurants:
    build:
      context: .
      dockerfile: services/restaurants/Dockerfile
      args: {VERSION: '${VERSION:-local}'}
    environment:
      DATABASE_URL: mssql://picky_restaurants:LOCAL_PASSWORD_FROM_VOLUME@sql:1433/picky_restaurants
      DINING_URL: http://dining:8000
      UI_ORIGIN: http://localhost:8080
    depends_on:
      db-init: {condition: service_completed_successfully}
      sql: {condition: service_healthy}
    entrypoint: [python, -m, service_runtime.local_start]
    command: [sh, -c, 'exec gunicorn --bind 0.0.0.0:$${PORT:-8000} --workers 1 --timeout 120 --access-logfile - services.restaurants.app:app']
    volumes: [restaurants-password:/run/picky:ro]
    ports: ['127.0.0.1:8001:8000']
  dining:
    build:
      context: .
      dockerfile: services/dining/Dockerfile
      args: {VERSION: '${VERSION:-local}'}
    environment:
      DATABASE_URL: mssql://picky_dining:LOCAL_PASSWORD_FROM_VOLUME@sql:1433/picky_dining
      RESTAURANTS_URL: http://restaurants:8000
      UI_ORIGIN: http://localhost:8080
    depends_on:
      db-init: {condition: service_completed_successfully}
      sql: {condition: service_healthy}
    entrypoint: [python, -m, service_runtime.local_start]
    command: [sh, -c, 'exec gunicorn --bind 0.0.0.0:$${PORT:-8000} --workers 1 --timeout 120 --access-logfile - services.dining.app:app']
    volumes: [dining-password:/run/picky:ro]
    ports: ['127.0.0.1:8002:8000']
  ui:
    image: nginx:alpine
    ports: ['127.0.0.1:8080:80']
    volumes: ['./ui:/usr/share/nginx/html:ro']
volumes:
  sql-data:
  sql-password:
  restaurants-password:
  dining-password:

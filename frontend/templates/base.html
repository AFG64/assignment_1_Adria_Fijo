<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DevOps Food{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">Personal restaurant journal</p>
        <h1>DevOps Food</h1>
        <p>{% block intro %}Save places you want to try and restaurants you have visited.{% endblock %}</p>
        <nav class="page-nav" aria-label="Restaurant pages">
          <a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}aria-current="page"{% endif %}>Saved restaurants</a>
          <a href="{{ url_for('all_restaurants') }}" {% if request.endpoint == 'all_restaurants' %}aria-current="page"{% endif %}>All restaurants</a>
        </nav>
      </header>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>

{
  "openapi": "3.0.3",
  "info": {
    "title": "Picky dining API",
    "version": "0.1.0",
    "description": "Dining SQL API with server-side restaurant coordination, explicit partial failure and idempotent history cleanup."
  },
  "paths": {
    "/saved-restaurants/{saved_id}/visits": {
      "get": {
        "operationId": "listVisits",
        "description": "Reads own database only. An empty history is an empty array.",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Visit"
                  }
                }
              }
            }
          },
          "503": {
            "description": "Own database or required peer unavailable; inspect error code before retrying",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "post": {
        "operationId": "recordVisit",
        "description": "Validates saved entry, marks it visited via bounded HTTP, then inserts a visit under an own-database lock. POST is not idempotent: no automatic retry. 503 distinguishes peer_unavailable (no visit inserted) from visit_outcome_uncertain (check history first). Restaurant status may remain visited after failure. Visit date validation uses the Europe/Madrid calendar, matching the static UI.",
        "responses": {
          "201": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Visit"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Conflict",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Own database or required peer unavailable; inspect error code before retrying",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "visit_date": {
                    "type": "string",
                    "format": "date"
                  },
                  "rating": {
                    "type": "number",
                    "minimum": 0,
                    "maximum": 5,
                    "nullable": true
                  },
                  "notes": {
                    "type": "string",
                    "maxLength": 2000,
                    "nullable": true
                  }
                },
                "required": [
                  "visit_date"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      },
      "parameters": [
        {
          "name": "saved_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "integer",
            "minimum": 1
          }
        }
      ]
    },
    "/saved-restaurants/{saved_id}/history": {
      "delete": {
        "operationId": "deleteHistory",
        "description": "Idempotent deletion of own visits/items/bills under a per-saved-ID transaction lock; returns 204 even when already empty. Used by restaurant cleanup.",
        "responses": {
          "204": {
            "description": "Completed; no response body"
          },
          "409": {
            "description": "Conflict",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Own database or required peer unavailable; inspect error code before retrying",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "parameters": [
        {
          "name": "saved_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "integer",
            "minimum": 1
          }
        }
      ]
    },
    "/saved-restaurants/{saved_id}/visits/{visit_id}/items": {
      "post": {
        "operationId": "addItem",
        "description": "",
        "responses": {
          "201": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Item"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Own database or required peer unavailable; inspect error code before retrying",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "item_name": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 300
                  },
                  "quantity": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 2147483647
                  },
                  "unit_price": {
                    "type": "number",
                    "minimum": 0,
                    "nullable": true,
                    "maximum": 9999999999.99
                  }
                },
                "required": [
                  "item_name"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      },
      "parameters": [
        {
          "name": "saved_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "integer",
            "minimum": 1
          }
        },
        {
          "name": "visit_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "integer",
            "minimum": 1
          }
        }
      ]
    },
    "/saved-restaurants/{saved_id}/visits/{visit_id}/bills": {
      "post": {
        "operationId": "uploadBill",
        "description": "PNG, JPEG or PDF signature; maximum 5 MiB. Binary contents stored in dining SQL.",
        "responses": {
          "201": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Bill"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "File too large",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Own database or required peer unavailable; inspect error code before retrying",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "bill_file": {
                    "type": "string",
                    "format": "binary"
                  }
                },
                "required": [
                  "bill_file"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      },
      "parameters": [
        {
          "name": "saved_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "integer",
            "minimum": 1
          }
        },
        {
          "name": "visit_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "integer",
            "minimum": 1
          }
        }
      ]
    },
    "/saved-restaurants/{saved_id}/visits/{visit_id}/bills/{bill_id}": {
      "get": {
        "operationId": "downloadBill",
        "description": "Checks bill/visit/saved ID ownership before returning attachment.",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/octet-stream": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "404": {
            "description": "Not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Own database or required peer unavailable; inspect error code before retrying",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "parameters": [
        {
          "name": "saved_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "integer",
            "minimum": 1
          }
        },
        {
          "name": "visit_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "integer",
            "minimum": 1
          }
        },
        {
          "name": "bill_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "integer",
            "minimum": 1
          }
        }
      ]
    },
    "/health": {
      "get": {
        "operationId": "health",
        "description": "Read/write probe of this service database only. Never probes the peer.",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                }
              }
            }
          },
          "503": {
            "description": "Own database or required peer unavailable; inspect error code before retrying",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Error": {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "retryable": {
            "type": "boolean"
          }
        },
        "required": [
          "error",
          "message",
          "retryable"
        ],
        "additionalProperties": false
      },
      "Health": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok",
              "unavailable"
            ]
          },
          "db": {
            "type": "string",
            "enum": [
              "ok",
              "unavailable"
            ]
          },
          "version": {
            "type": "string"
          }
        },
        "required": [
          "status",
          "db",
          "version"
        ],
        "additionalProperties": false
      },
      "Visit": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "minimum": 1
          },
          "saved_restaurant_id": {
            "type": "integer",
            "minimum": 1
          },
          "visit_date": {
            "type": "string",
            "format": "date"
          },
          "rating": {
            "type": "number",
            "minimum": 0,
            "maximum": 5,
            "nullable": true
          },
          "notes": {
            "type": "string",
            "maxLength": 2000,
            "nullable": true
          },
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Item"
            }
          },
          "bills": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Bill"
            }
          }
        },
        "required": [
          "id",
          "saved_restaurant_id",
          "visit_date",
          "rating",
          "notes",
          "items",
          "bills"
        ],
        "additionalProperties": false
      },
      "Item": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "minimum": 1
          },
          "visit_id": {
            "type": "integer",
            "minimum": 1
          },
          "item_name": {
            "type": "string",
            "minLength": 1
          },
          "quantity": {
            "type": "integer",
            "minimum": 1
          },
          "unit_price": {
            "type": "number",
            "minimum": 0,
            "nullable": true
          }
        },
        "required": [
          "id",
          "visit_id",
          "item_name",
          "quantity",
          "unit_price"
        ],
        "additionalProperties": false
      },
      "Bill": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "minimum": 1
          },
          "visit_id": {
            "type": "integer",
            "minimum": 1
          }
        },
        "required": [
          "id",
          "visit_id"
        ],
        "additionalProperties": false
      }
    }
  }
}

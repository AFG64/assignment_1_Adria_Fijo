              }
            }
          },
          "404": {
            "description": "Not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Own database or required peer unavailable; inspect error code before retrying",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "parameters": [
        {
          "name": "restaurant_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "integer",
            "minimum": 1
          }
        }
      ]
    },
    "/restaurants/{restaurant_id}/saved-entry": {
      "post": {
        "operationId": "saveRestaurant",
        "description": "",
        "responses": {
          "201": {
            "description": "Success",

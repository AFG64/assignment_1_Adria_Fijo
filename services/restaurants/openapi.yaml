{
  "openapi": "3.0.3",
  "info": {
    "title": "Picky restaurants API",
    "version": "0.1.0",
    "description": "Restaurant SQL API implemented except coordinated deletion, which returns 503 until milestone 5. Initial schema and seeded catalog remain 001 only."
  },
  "paths": {
    "/restaurants": {
      "get": {
        "operationId": "listRestaurants",
        "description": "",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Restaurant"
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid input",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Own database or required peer unavailable; inspect error code before retrying",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "category",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "city",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "price",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 4
            }
          },
          {
            "name": "min_rating",
            "in": "query",
            "schema": {
              "type": "number",
              "minimum": 0,
              "maximum": 5
            }
          },
          {
            "name": "status",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "want_to_go",
                "visited",
                "not_saved"
              ]
            }
          }
        ]
      },
      "post": {
        "operationId": "createRestaurant",
        "description": "Creates restaurant and saved entry atomically. Optional address lookup has a bounded timeout; failure returns 400 without creating records.",
        "responses": {
          "201": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Restaurant"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Own database or required peer unavailable; inspect error code before retrying",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "415": {
            "description": "Expected application/json",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateRestaurant"
              }
            }
          }
        }
      }
    },
    "/restaurants/{restaurant_id}": {
      "get": {
        "operationId": "getRestaurant",
        "description": "",
        "responses": {
          "200": {
            "description": "Success",

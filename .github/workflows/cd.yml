name: Deploy main to Azure
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: picky-production
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [restaurants, dining]
    steps:
      - uses: actions/checkout@v4
      - name: Define lowercase SHA image name
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/picky-${SERVICE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: VERSION=${{ github.sha }}
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy exact SHA, verify both APIs and upload the static UI
        env:
          PREFIX: ${{ vars.PREFIX }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          UI_STORAGE: ${{ vars.UI_STORAGE }}
          RESTAURANTS_DB_PASSWORD: ${{ secrets.RESTAURANTS_DB_PASSWORD }}
          DINING_DB_PASSWORD: ${{ secrets.DINING_DB_PASSWORD }}
        run: python scripts/azure_deploy.py deploy
      - name: End Azure session
        if: always()
        run: az logout

name: CI baseline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint current Python and contract checks
        run: python -m ruff check --select E9,F63,F7,F82 app.py backend database tests scripts
      - name: Validate system and proposed API contracts
        run: python scripts/validate_contracts.py --require-system
      - name: Test existing behavior and measure each domain
        run: python -m pytest -q --cov=backend.restaurant_domain --cov=backend.dining_history --cov-report=term-missing --cov-report=json
      - run: python scripts/check_domain_coverage.py
# Milestone 1 baseline only. Milestone 2 must add both image builds and isolated
# SQL checks before the first Assignment 2 PR merges. Service coverage replaces
# the transitional domain-module coverage as the services are implemented.

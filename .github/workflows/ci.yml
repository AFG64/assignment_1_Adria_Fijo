name: CI
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint current Python and contract checks
        run: python -m ruff check --select E9,F63,F7,F82 app.py backend database tests scripts service_runtime services
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check static UI JavaScript syntax
        run: node --check ui/app.js && node --check ui/config.js
      - name: Validate system and proposed API contracts
        run: python scripts/validate_contracts.py --require-system
      - name: Validate deployment plan and migration checkpoint offline
        run: python scripts/azure_deploy.py validate
      - name: Compile Azure infrastructure without signing in
        run: |
          az bicep install --version v0.39.26
          az bicep build --file infra/azure/main.bicep --outfile "$RUNNER_TEMP/picky-template.json"
      - name: Lint GitHub workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Test existing behavior and measure each domain
        run: python -m pytest -q --cov=backend.restaurant_domain --cov=backend.dining_history --cov=service_runtime --cov=services.restaurants --cov=services.dining --cov-report=term-missing --cov-report=json
      - run: python scripts/check_domain_coverage.py
  containers-and-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate private local-only test configuration
        run: python scripts/configure_local.py
      - name: Build both images and start isolated SQL stack
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Own SQL, login isolation, repeat boot and restart persistence
        run: python scripts/check_stack.py
      - name: Restaurant SQL API workflows
        run: python scripts/check_restaurant_api.py
      - name: Dining SQL and repeatable transfer
        run: python scripts/check_dining_sql.py
      - name: Service coordination and stopped-peer recovery
        run: python scripts/check_seam.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop disposable CI containers
        if: always()
        run: docker compose down --volumes
# Main calls these same gates through cd.yml. No Azure SQL is contacted by CI.
